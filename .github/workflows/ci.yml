name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust_test:
    name: Rust Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run Rust tests
        working-directory: ./dsp-wasm
        run: cargo test --lib

      - name: Check Rust formatting
        working-directory: ./dsp-wasm
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: ./dsp-wasm
        run: cargo clippy -- -D warnings

  wasm_build:
    name: WASM Build
    runs-on: ubuntu-latest
    needs: rust_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,wasm-pack

      - name: Build WASM
        working-directory: ./dsp-wasm
        run: cargo make build

  build_and_test:
    name: Node.js Build and Test
    runs-on: ubuntu-latest
    needs: wasm_build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,wasm-pack

      - name: Build WASM
        working-directory: ./dsp-wasm
        run: cargo make build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Run Tests
        run: npm run test -- --run
